<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon (1).ico" type="image/x-icon">


    <title>YJU Store - Vendas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="theme-switch" aria-label="Alternar tema">
        <button type="button" class="btn btn-sm theme-btn" data-theme="light" aria-label="Tema claro"
            aria-pressed="false">☀️</button>
        <button type="button" class="btn btn-sm theme-btn active" data-theme="dark" aria-label="Tema escuro"
            aria-pressed="true">🌙</button>
    </div>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">YJU Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Quem somos</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Produtos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Bolsa.html">Bolsa</a></li>
                            <li><a class="dropdown-item" href="Calcas.html">Calças</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Saias</a></li>
                            <li><a class="dropdown-item" href="#">Vestidos</a></li>
                            <li><a class="dropdown-item" href="#">Acessorios</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="venda.html">Vendas</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container py-5">

        <div class="vendas-box">

            <h1 class="text-center mb-4">
                YJU Store
            </h1>

            <h3 class="mb-4">
                Formulário de Venda
            </h3>

            <form>

                <!-- Cliente -->
                <div class="mb-3">
                    <label for="cliente" class="form-label">
                        Nome do cliente
                    </label>

                    <input type="text" class="form-control" id="cliente" placeholder="Digite o nome do cliente"
                        required>
                </div>

                <!-- E-mail -->
                <div class="mb-3">
                    <label for="emailCliente" class="form-label">
                        E-mail
                    </label>

                    <input type="email" class="form-control" id="emailCliente" placeholder="cliente@email.com" required>
                </div>

                <!-- Produto -->
                <div class="mb-3">
                    <label for="produto" class="form-label">
                        Produto
                    </label>

                    <select class="form-select" id="produto" required>

                        <option value="">
                            Selecione um produto
                        </option>

                        <option value="camiseta">
                            Camiseta
                        </option>

                        <option value="calca">
                            Calça
                        </option>

                        <option value="vestido">
                            Vestido
                        </option>

                        <option value="acessorio">
                            Acessório
                        </option>

                    </select>
                </div>

                <!-- Quantidade -->
                <div class="mb-3">
                    <label for="quantidade" class="form-label">
                        Quantidade
                    </label>

                    <input type="number" class="form-control" id="quantidade" min="1" value="1" required>
                </div>

                <!-- Valor -->
                <div class="mb-3">
                    <label for="valor" class="form-label">
                        Valor da venda
                    </label>

                    <input type="number" class="form-control" id="valor" placeholder="0,00" step="0.01" required>
                </div>

                <!-- Forma de pagamento -->
                <div class="mb-3">
                    <label for="pagamento" class="form-label">
                        Forma de pagamento
                    </label>

                    <select class="form-select" id="pagamento" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="pix">
                            PIX
                        </option>

                        <option value="cartao">
                            Cartão
                        </option>

                        <option value="dinheiro">
                            Dinheiro
                        </option>

                        <option value="boleto">
                            Boleto
                        </option>

                    </select>
                </div>

                <!-- Observação -->
                <div class="mb-3">
                    <label for="observacao" class="form-label">
                        Observação
                    </label>

                    <textarea class="form-control" id="observacao" rows="4"
                        placeholder="Digite alguma observação..."></textarea>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn btn-success w-100">
                    Registrar Venda
                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const html = document.documentElement;
        const themeButtons = document.querySelectorAll('.theme-btn');

        function setTheme(theme) {
            html.setAttribute('data-bs-theme', theme);

            themeButtons.forEach((button) => {
                const isActive = button.dataset.theme === theme;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-pressed', String(isActive));
            });
        }

        themeButtons.forEach((button) => {
            button.addEventListener('click', () => setTheme(button.dataset.theme));
        });
    </script>
</body>

</html>
