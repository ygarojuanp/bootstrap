    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Bootstrap</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <div class="theme-switch" aria-label="Alternar tema">
        <button type="button" class="btn btn-sm theme-btn" data-theme="light" aria-label="Tema claro"
            aria-pressed="false">☀️</button>
        <button type="button" class="btn btn-sm theme-btn active" data-theme="dark" aria-label="Tema escuro"
            aria-pressed="true">🌙</button>
    </div>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">YJU Store</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Quem somos</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Produtos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Bolsa.html">Bolsa</a></li>
                            <li><a class="dropdown-item" href="Calcas.html">Calças</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="Saias.html">Saias</a></li>
                            <li><a class="dropdown-item" href="Vestidos.html">Vestidos</a></li>
                            <li><a class="dropdown-item" href="Acessorios.html">Acessorios</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Pedidos</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="login-box">

            <h2 class="text-center mb-4">YJU Store</h2>

            <form>

                <!-- E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Senha
                    </label>

                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
                </div>

                <!-- Botão -->
                <div>
                    <a href="venda.html" class="btn btn-primary">
                        Entrar
                    </a>
                </div>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const html = document.documentElement;
        const themeButtons = document.querySelectorAll('.theme-btn');

        function setTheme(theme) {
            html.setAttribute('data-bs-theme', theme);

            themeButtons.forEach((button) => {
                const isActive = button.dataset.theme === theme;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-pressed', String(isActive));
            });
        }

        themeButtons.forEach((button) => {
            button.addEventListener('click', () => setTheme(button.dataset.theme));
        });
    </script>
</body>

</html>
